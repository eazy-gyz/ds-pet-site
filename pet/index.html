<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DS桌宠 · 试玩区</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>

  <!-- 试玩区：她自己在这个框里溜达，可以拖、可以戳 -->
  <div class="desktop"></div>

  <div id="pet" class="pet">
    <div id="petBody" class="pet-body">
      <video id="petVideo" class="pet-video"
             poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
             muted playsinline autoplay loop
             webkit-playsinline
             disablepictureinpicture
             controlslist="nodownload nofullscreen noremoteplayback"
             preload="auto"></video>
      <div id="bubble" class="bubble">
        <i class="p p1"></i><i class="p p2"></i><i class="p p3"></i>
        <i class="p p4"></i><i class="p p5"></i>
        <div id="bubbleText" class="bubble-text"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">拖一拖她 · 双击戳一下 · 摸她一下就会出声</div>

  <script src="pet.js"></script>
</body>
</html>
